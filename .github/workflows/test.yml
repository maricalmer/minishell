name: CUnit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcunit1 \
            libcunit1-dev \
            libreadline-dev \
            make \
            wget \
            tar \
            autoconf \
            git \
            libbsd-dev

      - name: Compile Libft
        run: |
          if [ ! -d "lib/libft" ]; then
            git clone https://github.com/42Paris/libft lib/libft
          fi
          cd lib/libft
          make
          make bonus
      
      - name: Run tests
        run: |
          make test
          chmod +x ./test_runner
          ./test_runner 2> /dev/null | grep -E '^(Suite:|  Test:|Run Summary:|[[:space:]]+suites|[[:space:]]+tests|[[:space:]]+asserts|Elapsed time)'